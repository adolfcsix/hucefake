name: Spring Boot migration checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'README.md'
      - 'KIEM_THU.md'
      - 'compose*.yaml'
      - 'config/**'
      - '.github/workflows/spring-migration.yml'
concurrency:
  group: huce-acceptance-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: huce_spring
          POSTGRES_USER: fm05
          POSTGRES_PASSWORD: fm05_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fm05 -d huce_spring"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify HTTP route inventory
        run: |
          node backend/tests/api-surface.mjs
          node backend/tests/source-integrity.mjs
      - name: Compile and verify Java
        working-directory: backend
        run: mvn -B clean verify
      - name: Start Spring and verify authentication
        working-directory: backend
        env:
          DEMO: 'true'
          DB_URL: jdbc:postgresql://127.0.0.1:5432/huce_spring
          DB_USER: fm05
          DB_PASSWORD: fm05_local
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          java -jar target/huce-backend-1.0.0.jar > /tmp/huce.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/huce.log' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health; then break; fi
            kill -0 "$pid"
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          for role in STAFF MANAGER LECTURER STUDENT; do
            jar=$(mktemp)
            csrf=$(curl -fsS -c "$jar" http://127.0.0.1:8080/api/csrf | jq -r .token)
            curl -fsS -b "$jar" -c "$jar" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' -d "{\"role\":\"$role\"}" http://127.0.0.1:8080/api/auth/demo-login | jq -e --arg role "$role" '.role == $role'
            curl -fsS -b "$jar" http://127.0.0.1:8080/api/me | jq -e --arg role "$role" '.role == $role'
            curl -fsS -b "$jar" http://127.0.0.1:8080/api/catalog | jq -e '.semesters | length > 0'
            curl -fsS -b "$jar" -H "X-CSRF-Token: $csrf" -X POST http://127.0.0.1:8080/api/auth/logout
            test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" http://127.0.0.1:8080/api/me)" = 401
            rm -f "$jar"
          done
          HUCE_TEST_URL=http://127.0.0.1:8080 node tests/section-contract.mjs
          HUCE_BENCH_CI=true HUCE_TEST_URL=http://127.0.0.1:8080 node tests/ga-benchmark.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huce-ga-benchmark
          path: backend/target/ga-benchmark.json
          if-no-files-found: ignore
      - name: Private database and Java setup CLI
        working-directory: backend
        env:
          DEMO: 'false'
          DB_URL: jdbc:postgresql://127.0.0.1:5432/huce_private_ci
          DB_USER: fm05
          DB_PASSWORD: fm05_local
          FM05_SETUP_PASSWORD: PrivateTest@2026
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash tests/private-contract.sh
      - name: React build and tests
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Package React and Java from the verified checkout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/huce-ci-package"
          cp backend/target/huce-backend-1.0.0.jar "$RUNNER_TEMP/huce-tested-backend.jar"
          mkdir -p backend/src/main/resources/static
          cp -a frontend/dist/. backend/src/main/resources/static/
          mvn -B -o -f backend/pom.xml clean package -DskipTests
          cp backend/target/huce-backend-1.0.0.jar "$RUNNER_TEMP/huce-ci-package/huce.jar"
          python3 backend/tests/verify-package.py "$RUNNER_TEMP/huce-tested-backend.jar" "$RUNNER_TEMP/huce-ci-package/huce.jar" frontend/dist
          git rev-parse HEAD > "$RUNNER_TEMP/huce-ci-package/source.sha"
          cd "$RUNNER_TEMP/huce-ci-package"
          sha256sum huce.jar > package.sha256
      - name: Inventory exact Java runtime dependencies
        run: |
          python3 backend/tests/test-runtime-inventory.py
          mkdir -p "$RUNNER_TEMP/huce-maven-inventory"
          mvn -B -f backend/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -Dscope=runtime -DoutputType=json -DoutputFile="$RUNNER_TEMP/huce-maven-inventory/dependency-tree.json"
          python3 backend/tests/runtime-inventory.py "$RUNNER_TEMP/huce-maven-inventory/dependency-tree.json" "$RUNNER_TEMP/huce-ci-package/huce.jar" "$RUNNER_TEMP/huce-maven-inventory/huce.cdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: huce-maven-inventory
          path: ${{ runner.temp }}/huce-maven-inventory/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: huce-ci-package
          path: ${{ runner.temp }}/huce-ci-package/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  container:
    needs: smoke
    runs-on: ubuntu-24.04
    env:
      HUCE_BUILD_TARGET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: huce-ci-package
          path: .ci-package
      - name: Verify artifact SHA and Compose targets
        run: |
          set -euo pipefail
          test "$(cat .ci-package/source.sha)" = "$(git rev-parse HEAD)"
          (cd .ci-package && sha256sum -c package.sha256)
          docker compose -f compose.share.yaml config --format json | jq -e '.services.app.build.target == "ci"'
          docker compose -f compose.share.yaml -f compose.private.yaml config --format json | jq -e '.services.app.build.target == "ci"'
          HUCE_BUILD_TARGET=local docker compose -f compose.share.yaml config --format json | jq -e '.services.app.build.target == "local"'
      - name: Build full stack from verified package
        run: docker compose -f compose.share.yaml build
      - name: Start full stack
        run: docker compose -f compose.share.yaml up -d --no-build --wait --wait-timeout 180
      - name: Verify exact packaged JAR in running container
        run: |
          set -euo pipefail
          expected=$(cut -d' ' -f1 .ci-package/package.sha256)
          actual=$(docker compose -f compose.share.yaml exec -T app sha256sum /app/huce.jar | cut -d' ' -f1)
          test "$expected" = "$actual"
          echo "PASS: Docker runs exact same-run JAR"
      - name: Verify React served by Java and demo login
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8081
          curl -fsS "$base/health"
          curl -fsS "$base/" > /tmp/huce.html
          grep -q 'id="root"' /tmp/huce.html
          asset=$(grep -oE '/assets/[^" ]+\.js' /tmp/huce.html | head -1)
          test -n "$asset"
          curl -fsS "$base$asset" > /dev/null
          curl -fsS "$base/api/auth/mode" | jq -e '.demo == true'
          csrf=$(curl -fsS -c /tmp/huce.cookie "$base/api/csrf" | jq -r .token)
          curl -fsS -b /tmp/huce.cookie -c /tmp/huce.cookie -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' -d '{"role":"STAFF"}' "$base/api/auth/demo-login" | jq -e '.role == "STAFF"'
          curl -fsS -b /tmp/huce.cookie "$base/api/me" | jq -e '.role == "STAFF"'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium role navigation and responsive smoke tests
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          HUCE_TEST_URL=http://127.0.0.1:8081 node e2e/browser.mjs
      - name: Vite development proxy and real browser write workflows
        working-directory: frontend
        run: |
          set -euo pipefail
          BACKEND_URL=http://127.0.0.1:8081 npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/huce-vite.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/huce-vite.log' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/health; then break; fi
            kill -0 "$pid"
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/health
          HUCE_BROWSER_CI=true HUCE_TEST_URL=http://127.0.0.1:5173 node e2e/workflow.mjs
          HUCE_BROWSER_CI=true HUCE_TEST_URL=http://127.0.0.1:5173 node e2e/scheduling.mjs
      - name: Browser recovery and actual database restart
        working-directory: frontend
        run: HUCE_BROWSER_CI=true HUCE_TEST_URL=http://127.0.0.1:8081 node e2e/recovery.mjs
      - name: Private Docker browser acceptance
        env:
          HUCE_BROWSER_CI: 'true'
          FM05_SETUP_PASSWORD: PrivateBrowserCI@2026
        run: bash frontend/e2e/private-browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huce-chromium-screenshots
          path: frontend/e2e-results/
          if-no-files-found: ignore
      - name: Inspect logs
        if: always()
        run: docker compose -f compose.share.yaml logs --tail 150
      - name: Cleanup CI database
        if: always()
        run: docker compose -f compose.share.yaml down -v

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all locked frontend dependencies
        working-directory: frontend
        run: |
          mkdir -p audit-results
          npm audit --json --audit-level=high > audit-results/all.json
      - name: Audit production frontend dependencies
        if: always()
        working-directory: frontend
        run: |
          mkdir -p audit-results
          npm audit --omit=dev --json --audit-level=high > audit-results/runtime.json
      - name: Summarize findings without hiding failures
        if: always()
        working-directory: frontend
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          for(const name of ['all','runtime']){
            const file='audit-results/'+name+'.json'
            if(!fs.existsSync(file)) { console.log(name+': unavailable'); continue }
            const report=JSON.parse(fs.readFileSync(file,'utf8'))
            console.log(name,JSON.stringify(report.metadata?.vulnerabilities??report.error??{}))
            for(const [pkg,v] of Object.entries(report.vulnerabilities??{})){
              if(['high','critical'].includes(v.severity))console.log(JSON.stringify({pkg,severity:v.severity,range:v.range,via:v.via,fixAvailable:v.fixAvailable}))
            }
          }
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: huce-npm-audit
          path: frontend/audit-results/
          if-no-files-found: error
