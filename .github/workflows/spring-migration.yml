name: Spring Boot migration checks
on:
  pull_request:
    paths:
      - 'spring-backend/**'
      - 'backend/database/**'
      - 'frontend/**'
      - '.github/workflows/spring-migration.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: huce_spring
          POSTGRES_USER: fm05
          POSTGRES_PASSWORD: fm05_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fm05 -d huce_spring"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and verify Java
        working-directory: spring-backend
        run: mvn -B clean verify
      - name: Start Spring and verify authentication
        working-directory: spring-backend
        env:
          DEMO: 'true'
          DB_URL: jdbc:postgresql://127.0.0.1:5432/huce_spring
          DB_USER: fm05
          DB_PASSWORD: fm05_local
        run: |
          set -euo pipefail
          java -jar target/huce-backend-1.0.0.jar > /tmp/huce.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/huce.log' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health; then break; fi
            kill -0 "$pid"
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          for role in STAFF MANAGER LECTURER STUDENT; do
            jar=$(mktemp)
            csrf=$(curl -fsS -c "$jar" http://127.0.0.1:8080/api/csrf | jq -r .token)
            curl -fsS -b "$jar" -c "$jar" -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' -d "{\"role\":\"$role\"}" http://127.0.0.1:8080/api/auth/demo-login | jq -e --arg role "$role" '.role == $role'
            curl -fsS -b "$jar" http://127.0.0.1:8080/api/me | jq -e --arg role "$role" '.role == $role'
            curl -fsS -b "$jar" http://127.0.0.1:8080/api/catalog | jq -e '.semesters | length > 0'
            curl -fsS -b "$jar" -H "X-CSRF-Token: $csrf" -X POST http://127.0.0.1:8080/api/auth/logout
            test "$(curl -sS -o /dev/null -w '%{http_code}' -b "$jar" http://127.0.0.1:8080/api/me)" = 401
            rm -f "$jar"
          done
      - name: React build and tests
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
