name: huce-spring-demo
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${FM05_DB_NAME:-huce}
      POSTGRES_USER: fm05
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fm05_share_local}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fm05 -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    environment:
      DEMO: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${FM05_DB_NAME:-huce}
      DB_USER: fm05
      DB_PASSWORD: ${DB_PASSWORD:-fm05_share_local}
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${FM05_WEB_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "java", "-jar", "/app/huce.jar", "healthcheck"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 24
volumes:
  data:
