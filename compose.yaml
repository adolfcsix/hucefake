name: huce-spring-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: huce_spring
      POSTGRES_USER: fm05
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fm05_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fm05 -d huce_spring"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  data:
